[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wonder-mcp"
version = "0.1.0"
description = "MCP server wrapping the CDC WONDER Data Query Web Service"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx",
    "pydantic>=2.0",
    "beautifulsoup4",
    "lxml",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[project.scripts]
wonder-mcp = "wonder_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wonder_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
